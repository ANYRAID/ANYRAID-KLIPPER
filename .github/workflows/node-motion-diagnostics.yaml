name: Node motion diagnostics
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/node-motion-diagnostics.yaml'
      - 'host/scripts/diagnose-node-asan.ts'
      - 'host/src/diagnostics/graph-motion.ts'
      - 'host/src/diagnostics/motion-filters.ts'
      - 'host/src/diagnostics/legacy-motion-shaper.ts'
      - 'host/bench/motion-graph-reference.ts'
      - 'host/contracts/motion-graph-fixtures.ts'
      - 'host/contracts/motion-retirement.json'
      - 'host/contracts/motion-retirement/**'
  pull_request:
    paths:
      - '.github/workflows/node-motion-diagnostics.yaml'
      - 'host/scripts/diagnose-node-asan.ts'
      - 'host/src/diagnostics/graph-motion.ts'
      - 'host/src/diagnostics/motion-filters.ts'
      - 'host/src/diagnostics/legacy-motion-shaper.ts'
      - 'host/bench/motion-graph-reference.ts'
      - 'host/contracts/motion-graph-fixtures.ts'
      - 'host/contracts/motion-retirement.json'
      - 'host/contracts/motion-retirement/**'
permissions:
  contents: read
jobs:
  motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: ['26.9.0', '26.10.0']
        optimization: ['default', 'off']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify original motion reference in fresh processes
        shell: bash
        env:
          OPTIMIZATION: ${{ matrix.optimization }}
        run: |
          mkdir -p "$RUNNER_TEMP/motion-diagnostics"
          node host/scripts/diagnose-node-asan.ts \
            --case motion --asan off \
            --js-optimization "$OPTIMIZATION" \
            --runs 50 --workers 1 \
            --report-parent "$RUNNER_TEMP/motion-diagnostics" \
            2>&1 | tee "$RUNNER_TEMP/motion-diagnostics/run.log"
      - name: Preserve diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-${{ matrix.node }}-${{ matrix.optimization }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/motion-diagnostics/
          retention-days: 30
          if-no-files-found: warn
