# Perform continuous integration tests on updates and pull requests
name: Build test
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Run a full serial baseline before the parallel validation
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v5

    - name: Setup cache
      uses: actions/cache@v5
      with:
        path: ci_cache
        key: ${{ runner.os }}-build-${{ hashFiles('scripts/ci-install.sh') }}

    - name: Identify Python cache environment
      id: python-cache-env
      run: |
        python3 -c 'import platform; print("python3=" + platform.python_version())' >> "$GITHUB_OUTPUT"

    - name: Cache Python downloads and wheels
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/pip-cache
        key: ${{ runner.os }}-${{ runner.arch }}-ubuntu22.04-pip-v1-py2.7-py${{ steps.python-cache-env.outputs.python3 }}-${{ hashFiles('scripts/ci-install.sh', 'scripts/klippy-requirements.txt', 'scripts/tests-requirements.txt') }}

    - name: Test APT cache and fallback policy
      run: python3 scripts/test-ci-apt.py

    - name: Resolve APT archive versions
      id: apt-plan
      run: python3 scripts/ci-apt.py plan

    - name: Cache APT archives
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/apt-archives/*.deb
        key: ${{ runner.os }}-${{ runner.arch }}-ubuntu22.04-apt-v1-${{ hashFiles('scripts/ci-apt.py') }}-${{ steps.apt-plan.outputs.digest }}

    - name: Prepare tests
      env:
        CI_APT_PLAN_READY: "1"
        PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache
      run: ./scripts/ci-install.sh

    - name: Test regression file isolation
      run: python3 scripts/test-ci-klippy.py

    - name: Serial benchmark
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark }}
      env:
        CI_BUILD_JOBS: '1'
        CI_PARALLEL_TESTS: '0'
      run: ./scripts/ci-build.sh 2>&1

    - name: Test
      run: ./scripts/ci-build.sh 2>&1
