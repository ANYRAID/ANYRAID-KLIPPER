name: klipper3d deploy
on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - master
    paths:
      - docs/**
      - scripts/build-docs.ts
      - host/src/diagnostics/docs-*.ts
      - host/src/diagnostics/markdown-it-attrs.d.ts
      - host/package.json
      - host/package-lock.json
      - .github/workflows/klipper3d-deploy.yaml
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.9.0'
          cache: npm
          cache-dependency-path: host/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix host --ignore-scripts --no-audit --no-fund
      - name: Validate documentation renderer
        run: node --test --test-isolation=none --test-concurrency=1 host/test/docs-*.test.ts
      - name: Build Node Pages
        run: docs/_klipper3d/build-website.sh
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.4.3
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: site # The folder the action should deploy.
