name: Node host
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: host/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF regression reader and renderer
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Check source whitespace with Node
        working-directory: .
        run: ./scripts/check_whitespace.sh
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:protocol-native
      - run: npm run test:native-sanitized
      - name: Build Linux MCU with Node command generator
        working-directory: .
        run: |
          build_dir=$(mktemp -d)
          cp test/configs/linuxprocess.config "$build_dir/config"
          make KCONFIG_CONFIG="$build_dir/config" OUT="$build_dir/out/" olddefconfig
          make KCONFIG_CONFIG="$build_dir/config" OUT="$build_dir/out/" all
